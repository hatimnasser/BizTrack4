name: Deploy to Cloudflare Pages

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:   # Allow manual trigger from GitHub Actions tab

jobs:
  # ── Deploy to Cloudflare Pages ────────────────────────────────────────────
  deploy:
    name: Deploy BizTrack Pro
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for web (Vite)
        run: npm run build
        env:
          NODE_ENV: production

      # Copy PWA files into dist before deploying
      

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: biztrack-pro          # Change to your Cloudflare Pages project name
          directory: dist                    # Vite output directory
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: '3'

  # ── Build APK via Capacitor (optional — needs self-hosted runner or Docker) ─
